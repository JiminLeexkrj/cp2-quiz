<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>컴프2 100제</title>
  <meta name="description" content="컴퓨터프로그래밍2 이해 확인 100문제 — 문제마다 바로 정답과 해설을 확인하고 브라우저에서 Python을 실행해 볼 수 있는 퀴즈">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bd3'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // 첫 렌더 전에 저장된 테마를 적용해 깜빡임을 막는다.
    try { const t = localStorage.getItem('cp2quiz:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="openNav" aria-label="문제 목록 열기">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#" id="homeLink">
      <span class="brand-mark">Q</span>
      <span class="brand-text">컴프2 <b>이해 확인 100제</b></span>
    </a>
    <div class="progress" aria-label="진행 상황">
      <div class="progress-bar" id="progressBar" aria-hidden="true">
        <span class="seg good"></span><span class="seg meh"></span><span class="seg bad"></span>
      </div>
      <span class="progress-text" id="progressText"></span>
    </div>
    <button class="icon-btn" id="themeToggle" aria-label="다크 모드 전환" title="테마 전환">
      <svg class="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="문제 목록">
      <div class="sidebar-head only-mobile">
        <strong>문제 목록</strong>
        <button class="icon-btn" id="closeNav" aria-label="문제 목록 닫기">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="filter-group" role="group" aria-label="영역">
        <button class="chip" data-cat="all" aria-pressed="true">전체</button>
        <button class="chip" data-cat="concept" aria-pressed="false">개념</button>
        <button class="chip" data-cat="trace" aria-pressed="false">코드 해석</button>
        <button class="chip" data-cat="impl" aria-pressed="false">구현</button>
      </div>
      <div class="filter-group" role="group" aria-label="상태">
        <button class="chip" data-status="all" aria-pressed="true">모두</button>
        <button class="chip" data-status="todo" aria-pressed="false">안 푼 문제</button>
        <button class="chip" data-status="review" aria-pressed="false">복습 필요</button>
        <button class="chip" data-status="star" aria-pressed="false">★ 북마크</button>
      </div>

      <div id="grid"></div>

      <div class="legend" aria-hidden="true">
        <span><i class="dot good"></i>맞음</span>
        <span><i class="dot meh"></i>헷갈림</span>
        <span><i class="dot bad"></i>틀림</span>
        <span><i class="dot star">★</i>북마크</span>
      </div>

      <div class="stats" id="stats"></div>

      <div class="sidebar-actions">
        <button class="text-btn" id="randomBtn">무작위 문제</button>
        <button class="text-btn" id="guideBtn">학습 안내</button>
        <button class="text-btn danger" id="resetBtn">기록 초기화</button>
      </div>
    </aside>
    <div class="scrim only-mobile" id="scrim"></div>

    <main class="main" id="main" tabindex="-1">
      <!-- app.js가 렌더링 -->
    </main>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/runner.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
